# Configuration for the frontend container.
#
# Same split as the backend repo: docker-compose.yml says what runs, this file
# says what it is told. Everything here reaches the browser, so it holds public
# configuration only - never a token or a secret (CORE-020).

services:
  web:
    environment:
      ENV: ${ENV:-local}
      TZ: Europe/Bucharest
      # Public URL of the SCC API, written into /runtime-config.js at start-up
      # and read by the app before it boots. It is the browser that calls it, so
      # this must be an address the browser can reach - not a container name.
      #
      # Whatever origin this frontend is served from must also be listed in the
      # backend's ALLOWED_ORIGINS, or every request is blocked by CORS.
      API_URL: ${API_URL:-http://localhost:8000/}
      # Where the live websocket endpoints are served from. Empty = same host
      # as API_URL, which is where they live; `off` = polling only.
      LIVE_URL: ${LIVE_URL:-}
