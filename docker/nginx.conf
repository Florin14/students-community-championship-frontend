server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Behind the platform reverse proxy this is the only place that knows the
    # real client, so keep the log line useful.
    access_log /var/log/nginx/access.log;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    # Container-level probe. Answers without touching the filesystem so it stays
    # honest about whether nginx itself is serving.
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Written at container start by /docker-entrypoint.d/40-runtime-config.sh,
    # which is what lets one image run in every environment. It MUST NOT be
    # cached, or a browser would keep calling yesterday's API host.
    location = /runtime-config.js {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Vite fingerprints every asset filename, so these can be cached hard.
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    location / {
        # SPA: react-router owns the paths, so anything that is not a real file
        # falls back to the shell instead of 404-ing on a page refresh.
        try_files $uri $uri/ /index.html;

        # index.html is the map to the fingerprinted assets - caching it is how
        # a deploy silently keeps serving the previous build.
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Never advertise the version being run.
    server_tokens off;
}
